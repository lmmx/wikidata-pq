[package]
name = "wikidata-reshape"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "wikidata_reshape"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py313"] }
memchr = "2"
# Numbers read as genson reads them (claims_arrow.rs): serde_json's Number, without
# float_roundtrip (genson's features), so the floats are genson's to the bit
serde_json = "1"
rayon = "1"
ryu = "1"
simdutf8 = "0.1"
# zstd for the fused partition files (fuse.rs): one compression context reused for every page
zstd-safe = { version = "7", default-features = false, features = ["std"] }
# The native bz2 decoder (WIKIDATA_BZ2_DECODER=native in the split): a crate of its own,
# with no dependency on this one or on anything Wikidata's
mibz2 = { path = "../crates/mibz2" }

[profile.release]
codegen-units = 1
lto = "fat"
