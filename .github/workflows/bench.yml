# The public benchmark (bench/README.md): a commit against the one before it, on the same
# runner, interleaved, each on its own lockfile.
# - A pull request that changes the pipeline: trunk (its merge base with master) against
#   its head, posted as a comment on the pull request.
# - A push to master: the previous master commit against the new one, appended to the
#   bench-results branch (never to master).
# - From the Actions tab: any commit, branch or tag against its parent.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Commit, branch or tag to benchmark against its parent (empty: the one dispatched)"
        required: false
      rounds:
        description: "Rounds (each runs both arms once)"
        required: false
        default: "1"
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bench/*.py"
      - ".github/workflows/bench.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bench/*.py"
      - ".github/workflows/bench.yml"

# A push to a pull request cancels its run in progress; master's runs each make a record
concurrency:
  group: bench-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

env:
  DATA_COMMIT: e8c97e1d2b5f66c296e1b880deb66d31b4aeb006 # bench-data: benchmark data v1
  UV_PYTHON: "3.13"
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Harness
        uses: actions/checkout@v4
        with:
          path: harness
          fetch-depth: 0

      # The input data, cached by its commit (it is input, never a pipeline output)
      - name: Data cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: data
          key: bench-data-${{ env.DATA_COMMIT }}

      - name: Data
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_COMMIT }}
          path: data

      - name: Check the data
        run: cd data && sha256sum -c SHA256SUMS

      # The commit before (a) and the commit (b): a pull request's merge base with master
      # and its head, so the difference is the pull request's own commits; a push's
      # previous master commit and the new one; a dispatched commit's parent and itself
      - name: Arms
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          COMMIT: ${{ inputs.candidate || github.sha }}
        run: |
          cd harness
          case "$GITHUB_EVENT_NAME" in
            pull_request) before=$(git merge-base "$PR_BASE" "$PR_HEAD"); after=$PR_HEAD ;;
            push) before=$PUSH_BEFORE; after=$GITHUB_SHA ;;
            *) after=$(git rev-parse "$COMMIT^{commit}"); before=$(git rev-parse "$after^") ;;
          esac
          git worktree add --detach ../a "$before"
          git worktree add --detach ../b "$after"

      # uv's package cache and Python, keyed on the arms' lockfiles
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            a/uv.lock
            b/uv.lock
          python-version: ${{ env.UV_PYTHON }}

      # Each arm on its own lockfile, so a dependency change shows
      - name: Environments
        run: |
          (cd a && uv sync --frozen)
          (cd b && uv sync --frozen)

      - name: Run
        run: |
          b/.venv/bin/python harness/bench/ab.py --data data --out results \
            --arm before=a --arm after=b --rounds "${{ inputs.rounds || '1' }}"

      - name: Summary
        if: always()
        run: |
          if [ -f results/summary.md ]; then cat results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          echo "Harness: \`$(git -C harness rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, updated by each run
      - name: Comment
        if: always() && github.event_name == 'pull_request' && hashFiles('results/summary.md') != ''
        continue-on-error: true # a fork's pull request gets a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="$(printf '<!-- bench -->\n'; cat results/summary.md; printf '\n[Run](%s), candidate `%s`\n' "$RUN_URL" "${{ github.event.pull_request.head.sha }}")"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- bench -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

      # The record goes to the bench-results branch, a data-only store that is appended to
      # and never merged: nothing is committed to master
      - name: Results store
        if: success() && github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: bench-results
          path: store

      - name: Record
        if: success() && github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 ../harness/bench/record.py ../results/results.json . "$RUN_URL"
          git add -A
          git commit -qm "record ${GITHUB_SHA::7} against ${BEFORE::7}"
          for try in 1 2 3; do
            git push -q origin HEAD:bench-results && break
            git pull -q --rebase origin bench-results
          done

      - name: Raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            results/*.json
            results/*.jsonl
            results/*.log
            results/summary.md
