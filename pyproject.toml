[project]
name = "wikidata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.0.0",
    "huggingface-hub>=0.34.3",
    "httpx>=0.28.1",
    "matplotlib>=3.10.5",
    "obstore>=0.7.3",
    "orjson>=3.11.1",
    "polars>=2.0.0",
    "polars-genson>=1.3.3",
    "pq-glue>=0.1.0",
    "pyarrow>=25",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
]

[tool.uv]
package = true

[project.scripts]
process-wikidata = "wikidata.main:run"
finalise-wikidata = "wikidata.main:finalise"
download-wikidata = "wikidata.main:download"
render-cards = "wikidata.main:render_cards"
card-stats = "wikidata.card_stats:update_stats"
latest-dump = "wikidata.dump:run_latest"
download-dump = "wikidata.dump:run_download"
split-dump = "wikidata.dump:run_split"
promote-release = "wikidata.hub:run_promote"

[dependency-groups]
dev = [
    "pdbpp>=0.11.7",
]
emb = [
    "embedding-atlas>=0.24.0",
]
sae = [
    "dictionary-learning>=0.1.0",
]

[tool.uv.sources]
# pq-glue from its master (the writer, lmmx/pq-glue#2) until it is released
pq-glue = { git = "https://github.com/lmmx/pq-glue", rev = "e47f28b" }
