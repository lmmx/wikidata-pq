# The public benchmark (bench/README.md): a commit against the one before it, each on its
# own lockfile, in 3 rounds run in parallel, each round both commits on one runner.
# - A pull request that changes the pipeline: trunk (its merge base with master) against
#   its head, posted as a comment on the pull request.
# - A push to master: the previous master commit against the new one, appended to the
#   bench-results branch (never to master).
# - From the Actions tab: any commit, branch or tag against its parent.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Commit, branch or tag to benchmark against its parent (empty: the one dispatched)"
        required: false
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bench/*.py"
      - ".github/workflows/bench.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bench/*.py"
      - ".github/workflows/bench.yml"

# A push to a pull request cancels its run in progress; master's runs each make a record
concurrency:
  group: bench-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

env:
  DATA_COMMIT: e8c97e1d2b5f66c296e1b880deb66d31b4aeb006 # bench-data: benchmark data v1
  UV_PYTHON: "3.13"
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  ROUNDS: 3

jobs:
  # One round per job, in parallel: both commits on the job's runner. Each posts its round
  # to the pull request comment as it lands.
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
    env:
      ROUND: ${{ matrix.round }}
    steps:
      - name: Harness
        uses: actions/checkout@v4
        with:
          path: harness
          fetch-depth: 0

      - name: Comment (pending)
        if: github.event_name == 'pull_request'
        continue-on-error: true # a fork's pull request gets a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/bench/comment.py pending ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}

      # Earlier commits' measurements (cache/): the commit before is not run again when it
      # was measured on this CPU model
      - name: Results store
        uses: actions/checkout@v4
        with:
          ref: bench-results
          path: store

      # The input data, cached by its commit (it is input, never a pipeline output)
      - name: Data cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: data
          key: bench-data-${{ env.DATA_COMMIT }}

      - name: Data
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_COMMIT }}
          path: data

      - name: Check the data
        run: cd data && sha256sum -c SHA256SUMS

      # The commit before (a) and the commit (b): a pull request's merge base with master
      # and its head, so the difference is the pull request's own commits; a push's
      # previous master commit and the new one; a dispatched commit's parent and itself
      - name: Arms
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          COMMIT: ${{ inputs.candidate || github.sha }}
        run: |
          cd harness
          case "$GITHUB_EVENT_NAME" in
            pull_request) before=$(git merge-base "$PR_BASE" "$PR_HEAD"); after=$PR_HEAD ;;
            push) before=$PUSH_BEFORE; after=$GITHUB_SHA ;;
            *) after=$(git rev-parse "$COMMIT^{commit}"); before=$(git rev-parse "$after^") ;;
          esac
          git worktree add --detach ../a "$before"
          git worktree add --detach ../b "$after"

      # uv's package cache and Python, keyed on the arms' lockfiles
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            a/uv.lock
            b/uv.lock
          python-version: ${{ env.UV_PYTHON }}

      # Each arm on its own lockfile, so a dependency change shows
      - name: Environments
        run: |
          (cd a && uv sync --frozen)
          (cd b && uv sync --frozen)

      - name: Run
        run: |
          b/.venv/bin/python harness/bench/ab.py --data data --out results \
            --arm before=a --arm after=b --rounds 1 --seed "$ROUND" \
            --cache store/cache ${{ github.event_name == 'push' && '--write-cache' || '' }}

      - name: Comment (round)
        if: "!cancelled() && github.event_name == 'pull_request' && hashFiles('results/results.json') != ''"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/bench/comment.py round ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }} results/results.json "$ROUNDS"

      - name: Raw results
        if: "!cancelled()"
        uses: actions/upload-artifact@v4
        with:
          name: round-${{ matrix.round }}
          path: |
            results/*.json
            results/*.jsonl
            results/*.log
            results/summary.md
            store/cache/

  # Every round together: the summary, the final comment, and on a push to master the record
  finish:
    needs: round
    if: "!cancelled()"
    runs-on: ubuntu-latest
    steps:
      - name: Harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Rounds
        uses: actions/download-artifact@v4
        with:
          pattern: round-*
          path: rounds

      - name: Summary
        run: |
          files=$(ls rounds/round-*/results/results.json 2>/dev/null || true)
          if [ -z "$files" ]; then echo "No round finished." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          python3 harness/bench/combine.py "$ROUNDS" summary.md $files
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "FILES=$(echo $files)" >> "$GITHUB_ENV"

      - name: Comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$FILES" ]; then
            python3 harness/bench/comment.py final ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }} "$ROUNDS" $FILES
          else
            python3 harness/bench/comment.py failed ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}
          fi

      # The record (and the rounds' measurements, in cache/) go to the bench-results
      # branch, a data-only store that is appended to and never merged: nothing is
      # committed to master
      - name: Results store
        if: success() && github.event_name == 'push' && needs.round.result == 'success'
        uses: actions/checkout@v4
        with:
          ref: bench-results
          path: store

      - name: Record
        if: success() && github.event_name == 'push' && needs.round.result == 'success'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          for d in rounds/round-*/store/cache; do
            [ -d "$d" ] && cp -n "$d"/*.json store/cache/ 2>/dev/null || true
          done
          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 ../harness/bench/record.py . "$RUN_URL" $(for f in $FILES; do echo "../$f"; done)
          git add -A
          git commit -qm "record ${GITHUB_SHA::7} against ${BEFORE::7}"
          for try in 1 2 3; do
            git push -q origin HEAD:bench-results && break
            git pull -q --rebase origin bench-results
          done
