# The public benchmark (bench/README.md): a commit against the one before it, each on its
# own lockfile, in 3 rounds run in parallel, each round both commits on one runner.
# - A pull request that changes the pipeline: trunk (its merge base with master) against
#   its head, posted as a comment on the pull request.
# - A push to master: the previous master commit against the new one, appended to the
#   bench-results branch (never to master).
# - From the Actions tab: any commit, branch or tag against its parent.
# - Nightly: master's head against its parent, the full tier (not recorded).
# Two tiers of checks (bench/tiers.py, bench/README.md): a pull request runs the PR tier
# (the timed core, parity, the native bz2 decoder), and the extras it is relevant to after
# them; master, the nightly run and the Actions tab (by default) run the full tier.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Commit, branch or tag to benchmark (empty: the one dispatched)"
        required: false
      before:
        description: "Commit to compare it against (empty: its parent; the full tier's reference is 2d25be6)"
        required: false
      tier:
        description: "quick: 4 chunks, the pull request check. full: the campaign's 66-chunk workload"
        type: choice
        options: [quick, full]
        default: quick
      suite:
        description: "Checks. full: every section, as on master. pr: a pull request's PR tier (core, parity, native bz2 decoder)"
        type: choice
        options: [full, pr]
        default: full
  # (labeled: the label bench:full runs the full tier on the pull request; any other
  # label is not benchmarked, the gate)
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "src/**"
      - "reshape/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bench/*.py"
      - ".github/workflows/bench.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "reshape/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bench/*.py"
      - ".github/workflows/bench.yml"
  # The full tier nightly on master's head, whatever was pushed (bench 17.15.0)
  schedule:
    - cron: "17 3 * * *"

# A push to a pull request cancels its run in progress; master's runs each make a record.
# (A label other than bench:full has a group of its own, so it cancels nothing.)
concurrency:
  group: bench-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}-${{ inputs.tier }}-${{ inputs.suite }}-${{ inputs.before }}-${{ inputs.candidate }}${{ github.event.action == 'labeled' && github.event.label.name != 'bench:full' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write
  actions: read # (finish: the round jobs and their logs, for those lost: bench/lost.py)
  checks: read # (and their annotations, where a log cannot be had)

env:
  DATA_COMMIT: e8c97e1d2b5f66c296e1b880deb66d31b4aeb006 # bench-data: benchmark data v1
  UV_PYTHON: "3.13"
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  ROUNDS: 3
  # The PR tier on a pull request (and from the Actions tab when asked); the full tier otherwise
  SUITE: ${{ github.event_name == 'pull_request' && 'pr' || inputs.suite || 'full' }}

jobs:
  # Work in progress is not benchmarked: a draft pull request, or a head commit whose
  # subject starts with "wip" or holds "[wip]". Marking a draft ready runs it.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ github.event.pull_request.draft || false }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
        run: |
          run=true
          if [ "$ACTION" = labeled ] && [ "$LABEL" != "bench:full" ]; then
            run=false
            echo "A label other than bench:full: not benchmarked" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ github.event_name }}" = pull_request ]; then
            subject=$(gh api "repos/${{ github.repository }}/commits/$HEAD" --jq '.commit.message' | head -1)
            if [ "$DRAFT" = true ] || echo "$subject" | grep -qiE '^wip\b|\[wip\]'; then
              run=false
              echo "Work in progress (draft: $DRAFT; head: $subject): not benchmarked" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # A round is two jobs, in parallel with every other: forward runs the commit before
  # first, reverse the commit after first, so running first or second favours neither
  # (combine.paired). Each job posts its half to the pull request comment as it lands.
  round:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
        order: [forward, reverse]
    env:
      ROUND: ${{ matrix.round }}
      ORDER: ${{ matrix.order }}
    steps:
      # The job's clock, for its setup's wall (ab.py's durations, bench 17.15.0)
      - name: Clock
        run: echo "BENCH_JOB_START=$(date +%s.%N)" >> "$GITHUB_ENV"

      - name: Harness
        uses: actions/checkout@v4
        with:
          path: harness
          fetch-depth: 0

      # Earlier commits' results (runs/): the comment's opening table, a preview only. Both
      # commits are always measured here, paired on this runner: the same code differs by
      # up to 1.5x across runners, and by 2-9% across runners of one CPU model
      - name: Results store
        uses: actions/checkout@v4
        with:
          ref: bench-results
          path: store

      # The comment as the run starts: the commit before's figures from its own run in the
      # store, the commit after pending
      - name: Comment (pending)
        if: github.event_name == 'pull_request'
        continue-on-error: true # a fork's pull request gets a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git -C harness merge-base "$PR_BASE" "$PR_HEAD")
          python3 harness/bench/comment.py pending ${{ github.event.pull_request.number }} "$PR_HEAD" store "$base"

      # The input data, cached by its commit (it is input, never a pipeline output)
      - name: Data cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: data
          key: bench-data-${{ env.DATA_COMMIT }}

      - name: Data
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_COMMIT }}
          path: data

      - name: Check the data
        run: cd data && sha256sum -c SHA256SUMS

      # The commit before (a) and the commit (b): a pull request's merge base with master
      # and its head, so the difference is the pull request's own commits; a push's
      # previous master commit and the new one; a dispatched commit's parent and itself
      - name: Arms
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          COMMIT: ${{ inputs.candidate || github.sha }}
          BEFORE: ${{ inputs.before }}
        run: |
          cd harness
          case "$GITHUB_EVENT_NAME" in
            pull_request) before=$(git merge-base "$PR_BASE" "$PR_HEAD"); after=$PR_HEAD ;;
            push) before=$PUSH_BEFORE; after=$GITHUB_SHA ;;
            *) after=$(git rev-parse "$COMMIT^{commit}")
               before=$(git rev-parse "${BEFORE:-$after^}^{commit}") ;;
          esac
          git worktree add --detach ../a "$before"
          git worktree add --detach ../b "$after"

      # The split decompresses the dump with lbzip2 on all cores (dump._dump_lines), and
      # the gz dump with igzip (isal); pigz compresses the gz slice (dumpslice.py)
      - name: Decoders
        run: sudo apt-get install -y -qq lbzip2 isal pigz > /dev/null

      # The split's dump slice (bench/dumpslice.py), made from the data once and cached
      - name: Dump slice cache
        uses: actions/cache@v4
        with:
          path: dump-slice
          # (by tier: a tier's slice is made of its own chunk files)
          key: bench-dump-slice-${{ env.DATA_COMMIT }}-${{ inputs.tier || 'quick' }}-${{ hashFiles('harness/bench/dumpslice.py') }}

      # uv's package cache and Python, keyed on the arms' lockfiles
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            a/uv.lock
            b/uv.lock
          python-version: ${{ env.UV_PYTHON }}

      # A commit can take a dependency built by another repository's CI in place of
      # building it from source: its bench/wheels lists `<owner/repo> <run id> <artifact>`
      # a line, and its pyproject.toml takes the wheels by path from wheels/ (their hashes
      # in uv.lock, so another wheel fails the sync). Each artifact is downloaded into that
      # commit's wheels/, before its environment is made
      - name: Prebuilt wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for arm in a b; do
            [ -f "$arm/bench/wheels" ] || continue
            grep -Ev '^[[:space:]]*(#|$)' "$arm/bench/wheels" | while read -r repo run artifact; do
              gh run download "$run" -R "$repo" -n "$artifact" -D "$arm/wheels"
              echo "- \`$arm\`: $artifact of $repo run $run: $(cd "$arm/wheels" && ls *.whl | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
            done
          done

      # Each arm on its own lockfile, so a dependency change shows
      - name: Environments
        run: |
          (cd a && uv sync --frozen)
          (cd b && uv sync --frozen)

      - name: Comment (launch)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/bench/comment.py launch ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }} "$ROUNDS"

      # Which checks run (bench/tiers.py): the PR tier's in each arm's run, a pull
      # request's extras after both arms' (the paths it changes, the packages its lockfiles
      # change, or bench:full); the full tier, every section in each arm's run
      - name: Checks
        id: checks
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" > pr-body.txt
          python3 harness/bench/tiers.py a b --suite "$SUITE" --labels-json "$LABELS" --body-file pr-body.txt \
            --out suite.json > /dev/null

      # The PR tier (or, but for a pull request, the full tier): each arm's timed core, and
      # its sections; parity
      - name: Run
        env:
          BENCH_DUMP_SLICE: ${{ github.workspace }}/dump-slice/dump-slice.json.bz2
        run: |
          b/.venv/bin/python harness/bench/ab.py --data data --out results --suite suite.json \
            --arm before=a --arm after=b --rounds 1 --seed "$ROUND" --order "$ORDER" --tier "${{ inputs.tier || 'quick' }}"

      # This job's half, with the PR tier's figures: once every half is in, the comment's
      # full table, not waiting on the extras (latency.py times a run to this step's end)
      - name: "Comment: PR tier"
        if: "!cancelled() && github.event_name == 'pull_request' && hashFiles('results/results.json') != ''"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/bench/comment.py round ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }} results/results.json "$ROUNDS"

      # A pull request's extras, after both arms' cores, on the same runner, then the half again
      - name: "Run: extras"
        if: steps.checks.outputs.deferred != ''
        env:
          BENCH_DUMP_SLICE: ${{ github.workspace }}/dump-slice/dump-slice.json.bz2
        run: b/.venv/bin/python harness/bench/ab.py --data data --out results --resume

      - name: "Comment: extras"
        if: "!cancelled() && steps.checks.outputs.deferred != '' && github.event_name == 'pull_request' && hashFiles('results/results.json') != ''"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/bench/comment.py round ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }} results/results.json "$ROUNDS"

      - name: Raw results
        if: "!cancelled()"
        uses: actions/upload-artifact@v4
        with:
          name: round-${{ matrix.round }}-${{ matrix.order }}
          path: |
            results/*.json
            results/*.jsonl
            results/*.log
            results/summary.md

  # Every round together: the summary, the final comment, and on a push to master the record
  finish:
    needs: [gate, round]
    if: "!cancelled() && needs.gate.outputs.run == 'true'"
    runs-on: ubuntu-latest
    steps:
      - name: Harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Rounds
        uses: actions/download-artifact@v4
        with:
          pattern: round-*
          path: rounds

      # The round jobs whose results did not come in (a runner lost, most likely out of
      # memory), and why as far as their logs tell: named in the summary and the comment
      - name: Lost jobs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 harness/bench/lost.py lost.json "$ROUNDS" $(ls rounds/round-*/results.json 2>/dev/null)
          echo "BENCH_LOST=$PWD/lost.json" >> "$GITHUB_ENV"

      # The PR tier's latency: this run's, and the median of the last pull request runs'
      # (the Actions API: the results store holds master's runs only). Over 8 minutes, the
      # comment opens with a warning (bench/latency.py)
      - name: Latency
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 harness/bench/latency.py latency.json "$ROUNDS"
          echo "BENCH_LATENCY=$PWD/latency.json" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          files=$(ls rounds/round-*/results.json 2>/dev/null || true)
          python3 harness/bench/combine.py "$ROUNDS" summary.md $files
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$files" ]; then echo "No round finished." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          echo "FILES=$(echo $files)" >> "$GITHUB_ENV"

      - name: Comment
        if: "!cancelled() && github.event_name == 'pull_request'"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$FILES" ]; then
            python3 harness/bench/comment.py final ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }} "$ROUNDS" $FILES
          else
            python3 harness/bench/comment.py failed ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}
          fi

      # The record goes to the bench-results
      # branch, a data-only store that is appended to and never merged: nothing is
      # committed to master
      - name: Results store
        if: success() && needs.round.result == 'success' && env.SUITE == 'full' && (github.event_name == 'push' || inputs.tier == 'full')
        uses: actions/checkout@v4
        with:
          ref: bench-results
          path: store

      # A quick-tier push to master, or a full-tier run: one line in records.jsonl, tagged
      # with the harness version and the tier, its raw results in runs/<tier>/, and how
      # long the bench took (bench_duration). (A push is always the full tier of checks;
      # the nightly run is not recorded: its commit has its push's record.)
      - name: Record
        if: success() && needs.round.result == 'success' && env.SUITE == 'full' && (github.event_name == 'push' || inputs.tier == 'full')
        run: |
          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 ../harness/bench/record.py . "$RUN_URL" $(for f in $FILES; do echo "../$f"; done) > ../line.json
          git add -A
          git commit -qm "$(python3 -c 'import json; e = json.load(open("../line.json")); print("record bench %s %s: %s against %s" % (e["bench"], e["tier"], e["commit"][:7], e["previous"][:7]))')"
          for try in 1 2 3; do
            git push -q origin HEAD:bench-results && break
            git pull -q --rebase origin bench-results
          done
