# The dump's download and decompression, bz2 against gz, on CI's runners (prof/dumpio.sh),
# printed to the job log. Runs on a push to a profile/ branch.
name: Profile

on:
  push:
    branches: ["profile/**"]

env:
  UV_PYTHON: "3.13"

jobs:
  dump-io:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y lbzip2 pigz isal bc
      - uses: astral-sh/setup-uv@v6
      - run: uv venv && uv pip install isal zlib-ng
      - name: Download and decompression, bz2 against gz
        run: prof/dumpio.sh
