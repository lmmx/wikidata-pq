# The public benchmark (bench/README.md): a commit against the one before it, each on its
# own lockfile, in 3 rounds run in parallel, each round both commits on one runner.
# - A pull request that changes the pipeline: trunk (its merge base with master) against
#   its head, posted as a comment on the pull request.
# - A push to master: the previous master commit against the new one, appended to the
#   bench-results branch (never to master).
# - From the Actions tab: any commit, branch or tag against its parent.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Commit, branch or tag to benchmark (empty: the one dispatched)"
        required: false
      before:
        description: "Commit to compare it against (empty: its parent; the full tier's reference is 2d25be6)"
        required: false
      tier:
        description: "quick: 4 chunks, the pull request check. full: the campaign's 66-chunk workload"
        type: choice
        options: [quick, full]
        default: quick
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bench/*.py"
      - ".github/workflows/bench.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "bench/*.py"
      - ".github/workflows/bench.yml"

# A push to a pull request cancels its run in progress; master's runs each make a record
concurrency:
  group: bench-${{ github.event.pull_request.number || github.sha }}-${{ inputs.tier }}-${{ inputs.before }}-${{ inputs.candidate }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

env:
  DATA_COMMIT: e8c97e1d2b5f66c296e1b880deb66d31b4aeb006 # bench-data: benchmark data v1
  UV_PYTHON: "3.13"
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  ROUNDS: 3

jobs:
  # Work in progress is not benchmarked: a draft pull request, or a head commit whose
  # subject starts with "wip" or holds "[wip]". Marking a draft ready runs it.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ github.event.pull_request.draft || false }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            subject=$(gh api "repos/${{ github.repository }}/commits/$HEAD" --jq '.commit.message' | head -1)
            if [ "$DRAFT" = true ] || echo "$subject" | grep -qiE '^wip\b|\[wip\]'; then
              run=false
              echo "Work in progress (draft: $DRAFT; head: $subject): not benchmarked" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # Every round in one job, on one runner, so a run waits for one runner rather than
  # seven: each round's forward half runs the commit before first, its reverse half the
  # commit after first, so running first or second favours neither (combine.paired).
  # Each half posts to the pull request comment as it starts and as it lands.
  rounds:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Harness
        uses: actions/checkout@v4
        with:
          path: harness
          fetch-depth: 0

      # Earlier commits' results (runs/): the comment's opening table, a preview only. Both
      # commits are always measured here, paired on this runner: the same code differs by
      # up to 1.5x across runners, and by 2-9% across runners of one CPU model
      - name: Results store
        uses: actions/checkout@v4
        with:
          ref: bench-results
          path: store

      # The comment as the run starts: the commit before's figures from its own run in the
      # store, the commit after pending
      - name: Comment (pending)
        if: github.event_name == 'pull_request'
        continue-on-error: true # a fork's pull request gets a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git -C harness merge-base "$PR_BASE" "$PR_HEAD")
          python3 harness/bench/comment.py pending ${{ github.event.pull_request.number }} "$PR_HEAD" store "$base"

      # The input data, cached by its commit (it is input, never a pipeline output)
      - name: Data cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: data
          key: bench-data-${{ env.DATA_COMMIT }}

      - name: Data
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_COMMIT }}
          path: data

      - name: Check the data
        run: cd data && sha256sum -c SHA256SUMS

      # The commit before (a) and the commit (b): a pull request's merge base with master
      # and its head, so the difference is the pull request's own commits; a push's
      # previous master commit and the new one; a dispatched commit's parent and itself
      - name: Arms
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          COMMIT: ${{ inputs.candidate || github.sha }}
          BEFORE: ${{ inputs.before }}
        run: |
          cd harness
          case "$GITHUB_EVENT_NAME" in
            pull_request) before=$(git merge-base "$PR_BASE" "$PR_HEAD"); after=$PR_HEAD ;;
            push) before=$PUSH_BEFORE; after=$GITHUB_SHA ;;
            *) after=$(git rev-parse "$COMMIT^{commit}")
               before=$(git rev-parse "${BEFORE:-$after^}^{commit}") ;;
          esac
          git worktree add --detach ../a "$before"
          git worktree add --detach ../b "$after"

      # uv's package cache and Python, keyed on the arms' lockfiles
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            a/uv.lock
            b/uv.lock
          python-version: ${{ env.UV_PYTHON }}

      # Each arm on its own lockfile, so a dependency change shows
      - name: Environments
        run: |
          (cd a && uv sync --frozen)
          (cd b && uv sync --frozen)

      # The data read, and both arms' packages imported, once each before the first half:
      # otherwise only the first half's first arm would start with them cold
      - name: Warm up
        run: |
          cat data/*.parquet > /dev/null
          for arm in a b; do (cd $arm && .venv/bin/python -c "import polars, pyarrow, wikidata.main"); done

      # The halves in turn, 1 forward, 1 reverse, 2 forward...; each posts its launch and
      # its result to the comment. A failed half is reported and the rest still run
      - name: Rounds
        id: rounds
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for ROUND in $(seq 1 "$ROUNDS"); do
            for ORDER in forward reverse; do
              export ROUND ORDER
              out=results/round-$ROUND-$ORDER
              echo "::group::round $ROUND $ORDER"
              if [ -n "$PR" ]; then
                python3 harness/bench/comment.py launch "$PR" "$PR_HEAD" "$ROUNDS" || true
              fi
              if b/.venv/bin/python harness/bench/ab.py --data data --out "$out" \
                  --arm before=a --arm after=b --rounds 1 --seed "$ROUND" --order "$ORDER" --tier "${{ inputs.tier || 'quick' }}"; then
                if [ -n "$PR" ]; then
                  python3 harness/bench/comment.py round "$PR" "$PR_HEAD" "$out/results.json" "$ROUNDS" || true
                fi
              else
                failed=1
                echo "Round $ROUND $ORDER failed" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "::endgroup::"
            done
          done
          exit $failed

      - name: Raw results
        if: "!cancelled()"
        uses: actions/upload-artifact@v4
        with:
          name: rounds
          path: |
            results/*/*.json
            results/*/*.jsonl
            results/*/*.log
            results/*/summary.md

      # Every round together: the summary, the final comment, and on a push to master the record
      - name: Summary
        if: "!cancelled()"
        run: |
          files=$(ls results/round-*/results.json 2>/dev/null || true)
          if [ -z "$files" ]; then echo "No round finished." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          python3 harness/bench/combine.py "$ROUNDS" summary.md $files
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "FILES=$(echo $files)" >> "$GITHUB_ENV"

      - name: Comment
        if: "!cancelled() && github.event_name == 'pull_request'"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$FILES" ]; then
            python3 harness/bench/comment.py final ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }} "$ROUNDS" $FILES
          else
            python3 harness/bench/comment.py failed ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}
          fi

      # The record goes to the bench-results branch, a data-only store that is appended to
      # and never merged: nothing is committed to master. A quick-tier push to master, or a
      # full-tier run: one line in records.jsonl, tagged with the harness version and the
      # tier, its raw results in runs/<tier>/
      - name: Record
        if: success() && (github.event_name == 'push' || inputs.tier == 'full')
        run: |
          cd store
          git fetch -q origin bench-results && git reset -q --hard origin/bench-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 ../harness/bench/record.py . "$RUN_URL" $(for f in $FILES; do echo "../$f"; done) > ../line.json
          git add -A
          git commit -qm "$(python3 -c 'import json; e = json.load(open("../line.json")); print("record bench %s %s: %s against %s" % (e["bench"], e["tier"], e["commit"][:7], e["previous"][:7]))')"
          for try in 1 2 3; do
            git push -q origin HEAD:bench-results && break
            git pull -q --rebase origin bench-results
          done
