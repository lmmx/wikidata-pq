# The benchmark harness's version (semver). A change to what a tier measures or how (its
# workload, the timing, parity) is a new major version: results compare only within one.
# A new tier, or a change to how results are shown or stored, is a minor or patch version.
[project]
name = "wikidata-pq-bench"
version = "6.0.0"
requires-python = ">=3.11"
