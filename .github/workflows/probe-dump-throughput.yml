# Throwaway: dump download throughput from a runner through the branch's dump._fetch (a
# byte range only), one host and one connection count at a time, never more than 3.
name: Probe dump throughput
on:
  push:
    branches: [probe/dump-throughput]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q polars pyarrow orjson tqdm
      - name: Measure
        run: |
          W=https://dumps.wikimedia.org/wikidatawiki/entities
          Y=https://dumps.wikimedia.your.org/wikidatawiki/entities
          A=https://ftp.acc.umu.se/mirror/wikimedia.org/other/wikibase/wikidatawiki
          python probe/run_fetch.py $W 1 3e8
          python probe/run_fetch.py $W 3 2e9
          python probe/run_fetch.py $Y 1 2e9
          python probe/run_fetch.py $Y 3 2e9
          python probe/run_fetch.py $A 3 1e9
