[project]
name = "wikidata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=0.34.3",
    "httpx>=0.28.1",
    "numpy>=2",
    "obstore>=0.7.3",
    "orjson>=3.11.1",
    "polars>=2.0.0",
    "polars-genson>=1.6.0",
    "pq-glue>=0.3.0",
    "pyarrow>=25",
    "tqdm>=4.67.1",
    "wikidata-reshape",
]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["reshape"]

[tool.uv.sources]
wikidata-reshape = { workspace = true }

[project.scripts]
process-wikidata = "wikidata.main:run"
finalise-wikidata = "wikidata.main:finalise"
finalise-release-runs = "wikidata.cross_run:run"
download-wikidata = "wikidata.main:download"
render-cards = "wikidata.main:render_cards"
card-stats = "wikidata.card_stats:update_stats"
latest-dump = "wikidata.dump:run_latest"
download-dump = "wikidata.dump:run_download"
split-dump = "wikidata.dump:run_split"
promote-release = "wikidata.hub:run_promote"

[dependency-groups]
# The plotting scripts (scripts/plot_*.py, misc/), not the pipeline: with them out of its
# dependencies, pandas is not installed with it, which pyarrow would otherwise import in
# every worker that reaches some of its paths (pq.read_table, Schema.empty_table, ...)
plots = [
    "matplotlib>=3.10.5",
    "pandas>=2",
    "seaborn>=0.13.2",
]
dev = [
    "pdbpp>=0.11.7",
]
emb = [
    "embedding-atlas>=0.24.0",
]
sae = [
    "dictionary-learning>=0.1.0",
]
